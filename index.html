<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GBT Behavior Tracker</title>
    
    <!-- PWA & Mobile Web App Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ea580c" />
    
    <!-- iOS / Safari Web App settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GBT Tracker" />
    <link rel="apple-touch-icon" href="/src/assets/images/tiger_icon_1779212841108.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/src/assets/images/tiger_icon_1779212841108.png" />
    
    <!-- Splash screen optimization on mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for PWA bookmarking -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registered successfully:', reg.scope))
            .catch((err) => console.error('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
